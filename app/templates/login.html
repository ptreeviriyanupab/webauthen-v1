<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cybersecurity Lab &mdash; Login</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #0f172a, #1e293b);
    font-family: "Segoe UI", Roboto, sans-serif;
  }
  .lab-card {
    max-width: 420px;
    width: 100%;
    border: none;
    border-radius: 1rem;
    box-shadow: 0 20px 45px rgba(0, 0, 0, 0.35);
  }
  .lab-subtitle {
    color: #6c757d;
    font-size: 0.9rem;
  }
</style>
</head>
<body>
<div class="card lab-card p-4 p-md-5">
  <div class="text-center mb-4">
    <div class="fs-2 mb-1">&#128274;</div>
    <h1 class="h5 fw-bold mb-1">Cybersecurity Lab</h1>
    <p class="fw-semibold mb-2">Password Hash Cracking Simulation</p>
    <p class="lab-subtitle mb-0">Recover the password from the provided leaked hash and use it to authenticate.</p>
  </div>

  {% if error %}
  <div class="alert alert-danger py-2" role="alert">{{ error }}</div>
  {% endif %}

  <form method="post" action="/login" novalidate>
    <div class="mb-3">
      <label for="username" class="form-label">Username</label>
      <input type="text" class="form-control" id="username" name="username"
             value="{{ username }}" maxlength="64" required autofocus>
    </div>
    <div class="mb-4">
      <label for="password" class="form-label">Password</label>
      <input type="password" class="form-control" id="password" name="password"
             maxlength="128" required>
    </div>
    <button type="submit" class="btn btn-primary w-100">Login</button>
  </form>
</div>
</body>
</html>
